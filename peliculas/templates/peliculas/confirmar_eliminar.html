{% extends 'peliculas/base.html' %}

{% block titulo %}Eliminar película - PeliHub{% endblock %}

{% block contenido %}
<h2>¿Eliminar película?</h2>
<p>¿Estás seguro de que querés eliminar <strong>{{ pelicula.titulo }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<a class="text-link" href="{% url 'lista_peliculas' %}">Cancelar</a>
{% endblock %}
