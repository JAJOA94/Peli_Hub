{% extends 'peliculas/base.html' %}

{% block titulo %}Iniciar sesión - PeliHub{% endblock %}

{% block contenido %}
<h2>Iniciar sesión</h2>

<form method="POST">
    {% csrf_token %}
    {% if form.non_field_errors %}
        <div class="errorlist">{{ form.non_field_errors }}</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    {{ form.as_p }}
    <button type="submit">Iniciar sesión</button>
</form>

<a class="text-link" href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
<a class="text-link" href="{% url 'registro' %}">Crear una cuenta nueva</a>
{% endblock %}
