{% extends 'peliculas/base.html' %}

{% block titulo %}Recuperar contraseña - PeliHub{% endblock %}

{% block contenido %}
<h2>Recuperar contraseña</h2>
<p class="auth-intro">Ingresá tu correo y te enviaremos un enlace para restablecer la contraseña.</p>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar enlace</button>
</form>

<a class="text-link" href="{% url 'login' %}">← Volver a iniciar sesión</a>
{% endblock %}
